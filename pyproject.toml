[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "wpilib-installer-prototype"
version = "0.1.0"
description = "Qt IFW multi-repository installation and offline bundle prototype"
requires-python = ">=3.11"
dependencies = ["cryptography>=48,<51", "tuf==7.0.1", "securesystemslib[crypto]==1.6.0"]

[project.optional-dependencies]
ci = ["boto3>=1.40,<2"]

[project.scripts]
wpilib-manager = "installer_prototype.cli:main"

[tool.setuptools.packages.find]
include = ["installer_prototype*"]

[tool.setuptools.package-data]
installer_prototype = ["assets/*"]
