name: Installer client
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native target to validate (all for the complete matrix)
        type: choice
        default: all
        options: [all, ubuntu-24.04, windows-2022, macos-15-intel, macos-15]
  push:
    paths:
      - 'client-dotnet/**'
      - 'tooling/**'
      - 'pyproject.toml'
      - '.github/scripts/**'
      - 'tools/**'
      - '.github/containers/**'
      - '.github/workflows/client.yml'
      - '.github/workflows/desktop-acceptance.yml'
  pull_request:
    paths:
      - 'client-dotnet/**'
      - 'tooling/**'
      - 'pyproject.toml'
      - '.github/scripts/**'
      - 'tools/**'
      - '.github/containers/**'
      - '.github/workflows/client.yml'
      - '.github/workflows/desktop-acceptance.yml'
permissions:
  contents: read
  actions: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["ubuntu-24.04","windows-2022","macos-15-intel","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - run: python -m pip install -e .
      - if: runner.os == 'Linux'
        run: bash .github/scripts/install-linux-dependencies.sh xvfb libgl1-mesa-dri
      - if: runner.os == 'macOS'
        run: brew install sevenzip
      - run: python tools/bootstrap_ifw.py
      - name: Prepare signed HTTP fixtures and long root history
        run: python tools/prepare_client_online.py --ifw .tools/ifw --work build/online-fixture
      - name: Build single application
        run: python tools/build_client.py --source build/online-fixture/online-source.json --ifw .tools/ifw --assets build/online-fixture/assets --output build/online-fixture/download
      - name: Native offline installation, upgrade, maintenance and uninstall
        shell: bash
        run: |
          app=build/online-fixture/download/wpilib-manager
          if [ "$RUNNER_OS" = Windows ]; then app=build/online-fixture/download/WPILibManager.exe; fi
          if [ "$RUNNER_OS" = macOS ]; then app='build/online-fixture/download/WPILib Manager.app/Contents/MacOS/wpilib-manager'; fi
          prefix=()
          if [ "$RUNNER_OS" = Linux ]; then prefix=(xvfb-run -a); fi
          "${prefix[@]}" python -u tools/check_client_offline.py --app "$app" --baseline build/online-fixture/baseline/*.zip --candidate build/online-fixture/candidate/*.zip --work build/online-fixture/offline --report build/online-fixture/offline-report.json
      - name: Native authenticated refresh, caches, and offline-to-online upgrades
        shell: bash
        run: |
          app=build/online-fixture/download/wpilib-manager
          if [ "$RUNNER_OS" = Windows ]; then app=build/online-fixture/download/WPILibManager.exe; fi
          if [ "$RUNNER_OS" = macOS ]; then app='build/online-fixture/download/WPILib Manager.app/Contents/MacOS/wpilib-manager'; fi
          prefix=()
          if [ "$RUNNER_OS" = Linux ]; then prefix=(xvfb-run -a); fi
          "${prefix[@]}" python -u tools/check_client_online.py --app "$app" --fixture build/online-fixture --work build/online-fixture/native --report build/online-fixture/report.json
      - name: Native TUF and indefinite archival policy regression suite
        shell: bash
        run: |
          app=build/online-fixture/download/wpilib-manager
          if [ "$RUNNER_OS" = Windows ]; then app=build/online-fixture/download/WPILibManager.exe; fi
          if [ "$RUNNER_OS" = macOS ]; then app='build/online-fixture/download/WPILib Manager.app/Contents/MacOS/wpilib-manager'; fi
          python -u tools/check_client_trust.py --app "$app" --work build/online-fixture/trust --report build/online-fixture/trust-report.json
      - name: Headless Linux dependency and offline lifecycle checks
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -u tools/check_headless_linux.py --app build/online-fixture/download/wpilib-manager --engine build/online-fixture/assets/engine --baseline build/online-fixture/baseline/*.zip --candidate build/online-fixture/candidate/*.zip --work build/clean-linux --report build/clean-linux-report.json
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ubuntu-desktop-test-input
          retention-days: 14
          path: |
            build/online-fixture/manager-application.zip
            build/online-fixture/baseline/*.zip
            build/online-fixture/candidate/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: test-client-${{ matrix.os }}
          retention-days: 14
          path: build/online-fixture/manager-application.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-client-evidence-${{ matrix.os }}
          retention-days: 14
          path: |
            build/online-fixture/trust-report.json
            build/online-fixture/trust/invocations.json
            build/online-fixture/report.json
            build/online-fixture/offline-report.json
            build/online-fixture/offline/*.json
            build/online-fixture/offline/*.log
            build/online-fixture/offline/*.png
            build/online-fixture/assets/sizes.json
            build/online-fixture/assets/windows-imports.json
            build/online-fixture/native/*.json
            build/online-fixture/native/*.log
            build/online-fixture/native/*.png
            build/online-fixture/assets/dependency-audit.json
            build/online-fixture/assets/runtime.json
            build/clean-linux-report.json
            build/clean-linux/*/*.json
            build/clean-linux/*/*.png
            build/clean-linux/*/*.log
            build/clean-linux/*/base-packages.txt
          if-no-files-found: warn

  desktop:
    needs: native
    if: ${{ !inputs.platform || inputs.platform == 'all' || inputs.platform == 'ubuntu-24.04' }}
    uses: ./.github/workflows/desktop-acceptance.yml
    with:
      application_run: ${{ format('{0}', github.run_id) }}
      release: all
