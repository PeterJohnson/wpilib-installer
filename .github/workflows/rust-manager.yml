name: Rust single application
on:
  workflow_dispatch:
  push:
    paths:
      - 'manager/**'
      - '.github/scripts/install-linux-dependencies.sh'
      - 'tools/*rust*'
      - 'tools/check_dashboard_releases.py'
      - 'installer_prototype/manager.py'
      - '.github/workflows/rust-manager.yml'
  pull_request:
    paths:
      - 'manager/**'
      - '.github/scripts/install-linux-dependencies.sh'
      - 'tools/*rust*'
      - 'tools/check_dashboard_releases.py'
      - 'installer_prototype/manager.py'
      - '.github/workflows/rust-manager.yml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.0'
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: manager
      - run: python -m pip install -e .
      - if: runner.os == 'Linux'
        run: bash .github/scripts/install-linux-dependencies.sh xvfb libgl1-mesa-dri
      - if: runner.os == 'macOS'
        run: brew install sevenzip
      - if: runner.os == 'Windows'
        name: Install NASM for the native crypto build
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python tools/bootstrap_ifw.py
      - name: Prepare signed fixture bundles
        run: python tools/prepare_rust_fixture.py --ifw .tools/ifw --work build/rust-fixture
      - name: Build fixture application
        run: python tools/build_rust_manager.py --source build/rust-fixture/demo/registry-source.json --ifw .tools/ifw
      - name: Formatting and Rust tests
        shell: bash
        run: |
          cargo fmt --manifest-path manager/Cargo.toml --check
          WPILIB_ASSET_DIR="$PWD/build/rust-manager/assets" cargo test --release --locked --manifest-path manager/Cargo.toml
      - name: Native fixture startup and offline maintenance
        shell: bash
        run: |
          app=build/rust-manager/download/wpilib-manager
          if [ "$RUNNER_OS" = Windows ]; then app=build/rust-manager/download/WPILibManager.exe; fi
          if [ "$RUNNER_OS" = macOS ]; then app='build/rust-manager/download/WPILib Manager.app/Contents/MacOS/wpilib-manager'; fi
          prefix=()
          if [ "$RUNNER_OS" = Linux ]; then prefix=(xvfb-run -a); fi
          "${prefix[@]}" python -u tools/check_rust_manager.py --app "$app" --baseline build/rust-fixture/baseline/*.zip --candidate build/rust-fixture/candidate/*.zip --work build/rust-fixture/native --report build/rust-fixture/report.json
      - name: Prepare pinned real Elastic and AdvantageScope bundles
        run: python -u tools/check_dashboard_releases.py --ifw .tools/ifw --work build/rust-real --prepare-only
      - name: Build real-package application
        run: python tools/build_rust_manager.py --source build/rust-real/registry-source.json --ifw .tools/ifw --assets build/rust-real/assets --output build/rust-real/download
      - name: Native real-package startup and offline maintenance
        shell: bash
        run: |
          app=build/rust-real/download/wpilib-manager
          if [ "$RUNNER_OS" = Windows ]; then app=build/rust-real/download/WPILibManager.exe; fi
          if [ "$RUNNER_OS" = macOS ]; then app='build/rust-real/download/WPILib Manager.app/Contents/MacOS/wpilib-manager'; fi
          prefix=()
          if [ "$RUNNER_OS" = Linux ]; then prefix=(xvfb-run -a); fi
          "${prefix[@]}" python -u tools/check_rust_manager.py --app "$app" --baseline build/rust-real/baseline/current/*.zip --candidate build/rust-real/candidate/current/*.zip --work build/rust-real/native --report build/rust-real/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: rust-manager-fixture-demo-${{ matrix.os }}
          retention-days: 14
          path: |
            build/rust-manager/manager-application.zip
            build/rust-fixture/baseline/*.zip
            build/rust-fixture/candidate/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: rust-manager-real-demo-${{ matrix.os }}
          retention-days: 14
          path: |
            build/rust-real/manager-application.zip
            build/rust-real/baseline/current/*.zip
            build/rust-real/candidate/current/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-manager-evidence-${{ matrix.os }}
          retention-days: 14
          path: |
            build/rust-fixture/report.json
            build/rust-fixture/native/*.json
            build/rust-fixture/native/*.png
            build/rust-fixture/native/*.log
            build/rust-real/report.json
            build/rust-real/provenance.json
            build/rust-real/native/*.json
            build/rust-real/native/*.png
            build/rust-real/native/*.log
          if-no-files-found: warn
