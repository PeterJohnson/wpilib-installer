name: Rust self-contained application
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native target to validate (all for the complete matrix)
        type: choice
        default: all
        options: [all, ubuntu-24.04, windows-2022, macos-15-intel, macos-15]
  push:
    paths:
      - 'manager/**'
      - 'tools/*rust*'
      - '.cargo/**'
      - '.github/containers/**'
      - 'tools/build_linux_manager.py'
      - '.github/workflows/rust-contained.yml'
  pull_request:
    paths:
      - 'manager/**'
      - 'tools/*rust*'
      - '.cargo/**'
      - '.github/containers/**'
      - 'tools/build_linux_manager.py'
      - '.github/workflows/rust-contained.yml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["ubuntu-24.04","windows-2022","macos-15-intel","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.0'
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: manager
          cache-on-failure: true
      - run: python -m pip install -e .
      - if: runner.os == 'Linux'
        run: bash .github/scripts/install-linux-dependencies.sh xvfb libgl1-mesa-dri
      - if: runner.os == 'macOS'
        run: brew install sevenzip
      - if: runner.os == 'Windows'
        name: Install NASM
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python tools/bootstrap_ifw.py
      - name: Prepare signed HTTP fixtures and long root history
        run: python tools/prepare_rust_online.py --ifw .tools/ifw --work build/online-fixture
      - name: Build single application
        run: python tools/build_rust_manager.py --source build/online-fixture/online-source.json --ifw .tools/ifw --assets build/online-fixture/assets --output build/online-fixture/download
      - name: Rust formatting and unit tests
        shell: bash
        run: |
          cargo fmt --manifest-path manager/Cargo.toml --check
          if [ "$RUNNER_OS" != Linux ]; then
            MACOSX_DEPLOYMENT_TARGET=13.0 WPILIB_ASSET_DIR="$PWD/build/online-fixture/assets" cargo test --release --locked --manifest-path manager/Cargo.toml
          fi
      - name: Native authenticated refresh, caches, and offline-to-online upgrades
        shell: bash
        run: |
          app=build/online-fixture/download/wpilib-manager
          if [ "$RUNNER_OS" = Windows ]; then app=build/online-fixture/download/WPILibManager.exe; fi
          if [ "$RUNNER_OS" = macOS ]; then app='build/online-fixture/download/WPILib Manager.app/Contents/MacOS/wpilib-manager'; fi
          prefix=()
          if [ "$RUNNER_OS" = Linux ]; then prefix=(xvfb-run -a); fi
          "${prefix[@]}" python -u tools/check_rust_online.py --app "$app" --fixture build/online-fixture --work build/online-fixture/native --report build/online-fixture/report.json
      - name: Headless Linux dependency and offline lifecycle checks
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python -u tools/check_rust_clean_linux.py --app build/online-fixture/download/wpilib-manager --engine build/online-fixture/assets/engine --baseline build/online-fixture/baseline/*.zip --candidate build/online-fixture/candidate/*.zip --work build/clean-linux --report build/clean-linux-report.json
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ubuntu-desktop-test-input
          retention-days: 14
          path: |
            build/online-fixture/manager-application.zip
            build/online-fixture/baseline/*.zip
            build/online-fixture/candidate/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: self-contained-application-${{ matrix.os }}
          retention-days: 14
          path: build/online-fixture/manager-application.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: self-contained-evidence-${{ matrix.os }}
          retention-days: 14
          path: |
            build/online-fixture/report.json
            build/online-fixture/native/*.json
            build/online-fixture/native/*.log
            build/online-fixture/native/*.png
            build/online-fixture/assets/dependency-audit.json
            build/online-fixture/assets/runtime.json
            build/clean-linux-report.json
            build/clean-linux/*/*.json
            build/clean-linux/*/*.png
            build/clean-linux/*/*.log
            build/clean-linux/*/base-packages.txt
          if-no-files-found: warn

  desktop:
    needs: native
    if: ${{ !inputs.platform || inputs.platform == 'all' || inputs.platform == 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        release: ['24.04.4', '26.04.1']
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the disposable VM host
        run: |
          # Free space for a Desktop ISO and an installed disk on this disposable runner.
          sudo rm -rf /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils xorriso
          sudo setfacl -m "u:$(id -u):rw" /dev/kvm
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-desktop-test-input
          path: build/desktop-input
      - name: Unpack the delivered executable
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import zipfile
          out=Path('build/desktop-input/application')
          with zipfile.ZipFile('build/desktop-input/manager-application.zip') as z:
              z.extractall(out)
          (out/'wpilib-manager').chmod(0o755)
          PYTHON
      - name: Install stock Ubuntu Desktop and test host graphics
        run: |
          python -u tools/check_rust_desktop_vm.py --release '${{ matrix.release }}' --app build/desktop-input/application/wpilib-manager --baseline build/desktop-input/baseline/*.zip --candidate build/desktop-input/candidate/*.zip --iso-dir build/desktop-isos --work build/desktop-vm
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-desktop-evidence-${{ matrix.release }}
          retention-days: 14
          path: |
            build/desktop-vm/report.json
            build/desktop-vm/vm.json
            build/desktop-vm/*-serial.log
            build/desktop-vm/*-qemu.log
            build/desktop-vm/install-sources.yaml
            build/desktop-vm/share/*.json
            build/desktop-vm/share/*.png
            build/desktop-vm/share/*.log
            build/desktop-vm/share/base-packages.txt
            build/desktop-vm/share/install-logs/**
            build/desktop-vm/share/install-error-logs/**
          if-no-files-found: warn
