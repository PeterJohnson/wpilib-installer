name: Rust online TUF
on:
  workflow_dispatch:
  push:
    paths:
      - 'manager/**'
      - 'tools/*rust*'
      - 'tools/check_native_tuf.py'
      - '.github/workflows/rust-online.yml'
  pull_request:
    paths:
      - 'manager/**'
      - 'tools/*rust*'
      - 'tools/check_native_tuf.py'
      - '.github/workflows/rust-online.yml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.100.0'
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: manager
          cache-on-failure: true
      - run: python -m pip install -e .
      - if: runner.os == 'Linux'
        run: bash .github/scripts/install-linux-dependencies.sh xvfb libgl1-mesa-dri
      - if: runner.os == 'macOS'
        run: brew install sevenzip
      - if: runner.os == 'Windows'
        name: Install NASM
        shell: pwsh
        run: |
          choco install nasm --no-progress -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python tools/bootstrap_ifw.py
      - name: Prepare signed HTTP fixtures and long root history
        run: python tools/prepare_rust_online.py --ifw .tools/ifw --work build/online-fixture
      - name: Build single application
        run: python tools/build_rust_manager.py --source build/online-fixture/online-source.json --ifw .tools/ifw --assets build/online-fixture/assets --output build/online-fixture/download
      - name: Rust formatting and unit tests
        shell: bash
        run: |
          cargo fmt --manifest-path manager/Cargo.toml --check
          WPILIB_ASSET_DIR="$PWD/build/online-fixture/assets" cargo test --release --locked --manifest-path manager/Cargo.toml
      - name: Native authenticated refresh, caches, and offline-to-online upgrades
        shell: bash
        run: |
          app=build/online-fixture/download/wpilib-manager
          if [ "$RUNNER_OS" = Windows ]; then app=build/online-fixture/download/WPILibManager.exe; fi
          if [ "$RUNNER_OS" = macOS ]; then app='build/online-fixture/download/WPILib Manager.app/Contents/MacOS/wpilib-manager'; fi
          prefix=()
          if [ "$RUNNER_OS" = Linux ]; then prefix=(xvfb-run -a); fi
          "${prefix[@]}" python -u tools/check_rust_online.py --app "$app" --fixture build/online-fixture --work build/online-fixture/native --report build/online-fixture/report.json
      - name: Prepare real dashboard release origins
        run: python -u tools/check_dashboard_releases.py --ifw .tools/ifw --work build/online-real --prepare-only
      - run: python tools/prepare_rust_online.py --ifw .tools/ifw --work build/online-real --real
      - name: Build real-package application
        run: python tools/build_rust_manager.py --source build/online-real/online-source.json --ifw .tools/ifw --assets build/online-real/assets --output build/online-real/download
      - name: Native real-package offline-to-online upgrades and cache maintenance
        shell: bash
        run: |
          app=build/online-real/download/wpilib-manager
          if [ "$RUNNER_OS" = Windows ]; then app=build/online-real/download/WPILibManager.exe; fi
          if [ "$RUNNER_OS" = macOS ]; then app='build/online-real/download/WPILib Manager.app/Contents/MacOS/wpilib-manager'; fi
          prefix=()
          if [ "$RUNNER_OS" = Linux ]; then prefix=(xvfb-run -a); fi
          "${prefix[@]}" python -u tools/check_rust_online.py --app "$app" --fixture build/online-real --work build/online-real/native --report build/online-real/report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-online-evidence-${{ matrix.os }}
          retention-days: 14
          path: |
            build/online-fixture/report.json
            build/online-fixture/native/*.json
            build/online-fixture/native/*.log
            build/online-fixture/native/*.png
            build/online-real/report.json
            build/online-real/provenance.json
            build/online-real/native/*.json
            build/online-real/native/*.log
            build/online-real/native/*.png
          if-no-files-found: warn
