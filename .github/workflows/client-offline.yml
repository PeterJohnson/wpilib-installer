name: Extended client offline acceptance
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native target to validate
        type: choice
        default: all
        options: [all, ubuntu-24.04, windows-2022, macos-15-intel, macos-15]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["ubuntu-24.04","windows-2022","macos-15-intel","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.404'
      - run: python -m pip install -e .
      - if: runner.os == 'Linux'
        run: bash .github/scripts/install-linux-dependencies.sh xvfb libgl1-mesa-dri
      - if: runner.os == 'macOS'
        run: brew install sevenzip
      - run: python tools/bootstrap_ifw.py
      - name: Prepare signed fixture bundles
        run: python tools/prepare_client_fixture.py --ifw .tools/ifw --work build/client-fixture
      - name: Build fixture application
        run: python tools/build_client.py --source build/client-fixture/demo/registry-source.json --ifw .tools/ifw
      - name: Native fixture startup and offline maintenance
        shell: bash
        run: |
          app=build/client/download/wpilib-manager
          if [ "$RUNNER_OS" = Windows ]; then app=build/client/download/WPILibManager.exe; fi
          if [ "$RUNNER_OS" = macOS ]; then app='build/client/download/WPILib Manager.app/Contents/MacOS/wpilib-manager'; fi
          prefix=()
          if [ "$RUNNER_OS" = Linux ]; then prefix=(xvfb-run -a); fi
          "${prefix[@]}" python -u tools/check_client_offline.py --app "$app" --baseline build/client-fixture/baseline/*.zip --candidate build/client-fixture/candidate/*.zip --work build/client-fixture/native --report build/client-fixture/report.json
      - name: Prepare pinned real Elastic and AdvantageScope bundles
        run: python -u tools/check_dashboard_releases.py --ifw .tools/ifw --work build/client-real --prepare-only
      - name: Build real-package application
        run: python tools/build_client.py --source build/client-real/registry-source.json --ifw .tools/ifw --assets build/client-real/assets --output build/client-real/download
      - name: Native real-package startup and offline maintenance
        shell: bash
        run: |
          app=build/client-real/download/wpilib-manager
          if [ "$RUNNER_OS" = Windows ]; then app=build/client-real/download/WPILibManager.exe; fi
          if [ "$RUNNER_OS" = macOS ]; then app='build/client-real/download/WPILib Manager.app/Contents/MacOS/wpilib-manager'; fi
          prefix=()
          if [ "$RUNNER_OS" = Linux ]; then prefix=(xvfb-run -a); fi
          "${prefix[@]}" python -u tools/check_client_offline.py --app "$app" --baseline build/client-real/baseline/current/*.zip --candidate build/client-real/candidate/current/*.zip --work build/client-real/native --report build/client-real/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: test-client-offline-fixtures-${{ matrix.os }}
          retention-days: 14
          path: |
            build/client/manager-application.zip
            build/client-fixture/baseline/*.zip
            build/client-fixture/candidate/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: test-client-offline-real-${{ matrix.os }}
          retention-days: 14
          path: |
            build/client-real/manager-application.zip
            build/client-real/baseline/current/*.zip
            build/client-real/candidate/current/*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-client-offline-evidence-${{ matrix.os }}
          retention-days: 14
          path: |
            build/client-fixture/report.json
            build/client-fixture/native/*.json
            build/client-fixture/native/*.png
            build/client-fixture/native/*.log
            build/client-real/report.json
            build/client-real/provenance.json
            build/client-real/native/*.json
            build/client-real/native/*.png
            build/client-real/native/*.log
          if-no-files-found: warn
