name: Renew TUF registries and archival authorization

on:
  schedule:
    - cron: '43 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Renew published configuration, or apply reviewed configuration from this checkout
        type: choice
        options: [renew, apply]
        default: renew
      configuration:
        description: Optional filename under deployment/registry-publications (empty means all)
        type: string
        default: ''
      initialize:
        description: Allow first publication (apply mode only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  discover:
    if: vars.REGISTRY_RENEWAL_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      configurations: ${{ steps.matrix.outputs.configurations }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - id: matrix
        env:
          ONLY_CONFIGURATION: ${{ inputs.configuration }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          from installer_prototype.publication_storage import publication_key
          paths = sorted(Path('deployment/registry-publications').glob('*.json'))
          selected = os.environ.get('ONLY_CONFIGURATION')
          if selected:
              paths = [p for p in paths if p.name == selected]
          if not paths:
              raise SystemExit('No registry publication configurations found')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              matrix = [{'configuration': p.as_posix(),
                         'publication_key': publication_key(json.loads(p.read_text())['storage'])} for p in paths]
              stream.write('configurations=' + json.dumps(matrix) + '\n')
          PY
  renew:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.configurations) }}
    runs-on: ubuntu-24.04
    environment: registry-authority
    concurrency:
      group: installer-publication-${{ matrix.publication_key }}
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[ci]'
      - name: Renew authorization or publish a reviewed registry change
        env:
          REGISTRY_SIGNING_KEY: ${{ secrets.REGISTRY_SIGNING_KEY }}
          TUF_TARGETS_KEY: ${{ secrets.REGISTRY_TUF_TARGETS_KEY }}
          TUF_SNAPSHOT_KEY: ${{ secrets.REGISTRY_TUF_SNAPSHOT_KEY }}
          TUF_TIMESTAMP_KEY: ${{ secrets.REGISTRY_TUF_TIMESTAMP_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.REGISTRY_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.REGISTRY_S3_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.REGISTRY_S3_SESSION_TOKEN }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ARTIFACTORY_ACCESS_TOKEN }}
          PUBLICATION_SERIALIZATION_KEY: ${{ matrix.publication_key }}
          PUBLICATION_CONFIG: ${{ matrix.configuration }}
          PUBLICATION_MODE: ${{ inputs.mode || 'renew' }}
          INITIALIZE: ${{ inputs.initialize || false }}
        run: |
          extra=()
          if [[ "$INITIALIZE" == true ]]; then extra+=(--initialize); fi
          python -m installer_prototype.ci_publication registry \
            --config "$PUBLICATION_CONFIG" --mode "$PUBLICATION_MODE" \
            --output build/publication.json "${extra[@]}"
      - name: Name audit artifact
        id: audit
        env:
          PUBLICATION_CONFIG: ${{ matrix.configuration }}
        run: echo "name=$(basename "$PUBLICATION_CONFIG" .json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: registry-${{ steps.audit.outputs.name }}
          path: build/publication.json
          if-no-files-found: error
