name: Publish offline bundles
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Optional filename under deployment/bundle-publications (empty means all)
        type: string
        default: ''
      initialize:
        description: Allow first publication when no download page exists
        type: boolean
        default: false
  repository_dispatch:
    types: [package-published]
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
jobs:
  discover:
    if: vars.BUNDLE_ASSEMBLY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      publications: ${{ steps.matrix.outputs.publications }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - id: matrix
        env:
          ONLY_CONFIGURATION: ${{ inputs.configuration }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from installer_prototype.publication_storage import publication_key
          from installer_prototype.ci_publication import contained
          from installer_prototype.registry_updates import validate_source
          from installer_prototype.offline_acceptance import runner_for
          paths = sorted(Path('deployment/bundle-publications').glob('*.json'))
          selected = os.environ.get('ONLY_CONFIGURATION')
          if selected:
              paths = [p for p in paths if p.name == selected]
          if not paths:
              raise SystemExit('No bundle publication configurations found')
          matrix, destinations = [], set()
          for path in paths:
              config = json.loads(path.read_text())
              source = json.loads(contained('.', config['source']).read_text())
              validate_source(source)
              key = publication_key(config['storage'])
              if key in destinations:
                  raise SystemExit('Duplicate bundle publication destination')
              destinations.add(key)
              matrix.append({'configuration': path.as_posix(), 'name': path.stem,
                             'source': config['source'], 'target': source['target'],
                             'runner': runner_for(source['target']), 'publication_key': key})
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('publications=' + json.dumps(matrix) + '\n')
          PY
  platform-checks:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y 7zip
      - if: runner.os == 'macOS'
        run: brew install sevenzip
      - run: python tools/bootstrap_ifw.py
      - name: Require native offline fresh install and real version upgrade
        run: python tools/check_offline_fixture.py --ifw .tools/ifw --work build/fixture --report build/fixture-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-platform-${{ matrix.os }}
          path: |
            build/fixture-report.json
            build/fixture/native/*.log
          overwrite: true
          if-no-files-found: warn
  prepare:
    needs: discover
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.publications) }}
    concurrency:
      group: installer-publication-${{ matrix.publication_key }}
      cancel-in-progress: false
      queue: max
    environment: offline-bundles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[ci]'
      - uses: actions/cache@v4
        with:
          path: build/cache
          key: package-cache-${{ matrix.publication_key }}-${{ github.run_id }}
          restore-keys: package-cache-${{ matrix.publication_key }}-
      - name: Freeze candidate and last successful upgrade baseline without publishing
        env:
          BUNDLE_SIGNING_KEY: ${{ secrets.BUNDLE_SIGNING_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BUNDLE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNDLE_S3_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.BUNDLE_S3_SESSION_TOKEN }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ secrets.BUNDLE_ARTIFACTORY_ACCESS_TOKEN }}
          PUBLICATION_SERIALIZATION_KEY: ${{ matrix.publication_key }}
          PUBLICATION_CONFIG: ${{ matrix.configuration }}
          INITIALIZE: ${{ inputs.initialize || false }}
        run: |
          extra=()
          if [[ "$INITIALIZE" == true ]]; then extra+=(--initialize); fi
          python -m installer_prototype.ci_publication bundle-prepare \
            --config "$PUBLICATION_CONFIG" --cache build/cache --candidate build/candidate \
            --output build/preparation.json "${extra[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: offline-candidate-${{ matrix.name }}
          path: build/candidate/
          compression-level: 0
          retention-days: 3
          overwrite: true
          if-no-files-found: error
  validate:
    needs: [discover, prepare]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.publications) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y 7zip
      - if: runner.os == 'macOS'
        run: brew install sevenzip
      - run: python tools/bootstrap_ifw.py
      - uses: actions/download-artifact@v4
        with:
          name: offline-candidate-${{ matrix.name }}
          path: build/candidate
      - name: Install and upgrade the exact candidate offline on its native host
        shell: bash
        env:
          REGISTRY_SOURCE: ${{ matrix.source }}
        run: |
          python -m installer_prototype.offline_acceptance check \
            --candidate build/candidate --source "$REGISTRY_SOURCE" --ifw .tools/ifw \
            --work build/native --report build/acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-acceptance-${{ matrix.name }}
          path: |
            build/acceptance.json
            build/native/*.log
          overwrite: true
          if-no-files-found: warn
  publish:
    # All OS lifecycle checks and every selected candidate must succeed. No always().
    needs: [discover, prepare, validate, platform-checks]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.publications) }}
    concurrency:
      group: installer-publication-${{ matrix.publication_key }}
      cancel-in-progress: false
      queue: max
    environment: offline-bundles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[ci]'
      - uses: actions/download-artifact@v4
        with:
          name: offline-candidate-${{ matrix.name }}
          path: build/candidate
      - uses: actions/download-artifact@v4
        with:
          name: offline-acceptance-${{ matrix.name }}
          path: build/acceptance
      - name: Publish tested bytes only if the upgrade baseline is still current
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BUNDLE_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BUNDLE_S3_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.BUNDLE_S3_SESSION_TOKEN }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ secrets.BUNDLE_ARTIFACTORY_ACCESS_TOKEN }}
          PUBLICATION_SERIALIZATION_KEY: ${{ matrix.publication_key }}
          PUBLICATION_CONFIG: ${{ matrix.configuration }}
        run: |
          python -m installer_prototype.ci_publication bundle-publish \
            --config "$PUBLICATION_CONFIG" --candidate build/candidate \
            --acceptance build/acceptance/acceptance.json --output build/publication.json
      - uses: actions/upload-artifact@v4
        with:
          name: offline-publication-${{ matrix.name }}
          path: build/publication.json
          overwrite: true
          if-no-files-found: error
