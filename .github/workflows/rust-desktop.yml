name: Rust Ubuntu Desktop acceptance
on:
  workflow_dispatch:
    inputs:
      application_run:
        description: Successful Linux application build run containing ubuntu-desktop-test-input
        type: string
        required: true
      release:
        description: Desktop ISO release
        type: choice
        default: all
        options: [all, '24.04.4', '26.04.1']
  workflow_call:
    inputs:
      application_run:
        type: string
        required: true
      release:
        type: string
        default: all
permissions:
  contents: read
  actions: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(inputs.release != 'all' && format('["{0}"]', inputs.release) || '["24.04.4","26.04.1"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare the disposable VM host
        run: |
          # Free space for a Desktop ISO and an installed disk on this disposable runner.
          sudo rm -rf /usr/local/lib/android /opt/ghc
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils xorriso
          # logind can remove a per-user device ACL between VM boots.
          # Group access remains valid for the whole controller process.
          sudo usermod -a -G kvm "$(id -un)"
          sudo chmod g+rw /dev/kvm
      - uses: actions/download-artifact@v4
        with:
          name: ubuntu-desktop-test-input
          github-token: ${{ github.token }}
          run-id: ${{ inputs.application_run }}
          path: build/desktop-input
      - name: Unpack the delivered executable
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          import zipfile
          out=Path('build/desktop-input/application')
          with zipfile.ZipFile('build/desktop-input/manager-application.zip') as z:
              z.extractall(out)
          (out/'wpilib-manager').chmod(0o755)
          PYTHON
      - name: Install stock Ubuntu Desktop and test host graphics
        run: |
          sg kvm -c "python -u tools/check_rust_desktop_vm.py --release '${{ matrix.release }}' --app build/desktop-input/application/wpilib-manager --baseline build/desktop-input/baseline/*.zip --candidate build/desktop-input/candidate/*.zip --iso-dir build/desktop-isos --work build/desktop-vm"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ubuntu-desktop-evidence-${{ matrix.release }}
          retention-days: 14
          path: |
            build/desktop-vm/report.json
            build/desktop-vm/vm.json
            build/desktop-vm/*-serial.log
            build/desktop-vm/*-qemu.log
            build/desktop-vm/install-sources.yaml
            build/desktop-vm/share/*.json
            build/desktop-vm/share/*.png
            build/desktop-vm/share/*.log
            build/desktop-vm/share/base-packages.txt
            build/desktop-vm/share/install-logs/**
            build/desktop-vm/share/install-error-logs/**
          if-no-files-found: warn
