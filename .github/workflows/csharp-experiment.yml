name: CSharp Native AOT experiment
on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        default: all
        options: [all, ubuntu-22.04, windows-2022, macos-15-intel, macos-15]
permissions:
  contents: read
  actions: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["ubuntu-22.04","windows-2022","macos-15-intel","macos-15"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: python -m pip install -e .
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang zlib1g-dev p7zip-full xvfb libgl1-mesa-dri libfontconfig1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-sync1 libx11-xcb1 fonts-dejavu-core
      - if: runner.os == 'macOS'
        run: brew install sevenzip
      - uses: actions/download-artifact@v4
        with:
          name: test-client-${{ matrix.os == 'ubuntu-22.04' && 'ubuntu-24.04' || matrix.os }}
          run-id: 46082370013
          github-token: ${{ github.token }}
          path: build/rust-baseline
      - run: python tools/bootstrap_ifw.py
      - run: python tools/prepare_client_fixture.py --ifw .tools/ifw --work build/csharp-fixture
      - name: Build native GUI/CLI and private Qt distribution
        run: python experiments/csharp-manager/build.py --source build/csharp-fixture/demo/registry-source.json --ifw .tools/ifw --work build/csharp --baseline build/rust-baseline/manager-application.zip
      - name: Native trust-policy suite through the single public executable
        shell: bash
        run: |
          app=$(cat build/csharp/app-path.txt)
          python -u experiments/csharp-manager/check.py --app "$app" --work build/csharp-policy --registry-source build/csharp-fixture/demo/registry-source.json --report build/csharp-policy.json
      - name: AOT GUI startup and isolated private Qt worker
        shell: bash
        run: |
          app=$(cat build/csharp/app-path.txt)
          prefix=()
          if [ "$RUNNER_OS" = Linux ]; then prefix=(xvfb-run -a); fi
          "${prefix[@]}" "$app" --ui-smoke "$PWD/build/csharp/gui-smoke.json"
          "$app" --engine-smoke
          python -c 'import json; r=json.load(open("build/csharp/gui-smoke.json")); assert r["visible"] and r["width"]>0 and r["height"]>0, r'
      - name: Record native dependencies
        shell: bash
        run: |
          app=$(cat build/csharp/app-path.txt)
          dotnet --info > build/csharp/dotnet-info.txt
          if [ "$RUNNER_OS" = Linux ]; then
            ldd "$app" > build/csharp/dependencies.txt
            ldd build/csharp/private/manager-experiment >> build/csharp/dependencies.txt
            for lib in build/csharp/private/*.so; do ldd "$lib" >> build/csharp/dependencies.txt; done
          elif [ "$RUNNER_OS" = macOS ]; then
            otool -L "$app" > build/csharp/dependencies.txt
            otool -L build/csharp/private/manager-experiment >> build/csharp/dependencies.txt
            for lib in build/csharp/private/*.dylib; do otool -L "$lib" >> build/csharp/dependencies.txt; done
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: csharp-evidence-${{ matrix.os }}
          path: |
            build/csharp-policy.json
            build/csharp-policy/invocations.json
            build/csharp/sizes.json
            build/csharp/gui-smoke.json
            build/csharp/dependencies.txt
            build/csharp/windows-imports.json
            build/csharp/dotnet-info.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: csharp-application-${{ matrix.os }}
          path: build/csharp/csharp-application.zip
          if-no-files-found: error
