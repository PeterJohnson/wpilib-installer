name: Publish or renew a TUF publisher repository

on:
  workflow_call:
    inputs:
      tooling_repository:
        description: Repository containing the installer prototype
        required: true
        type: string
      tooling_ref:
        description: Full commit SHA matching the reusable workflow revision
        required: true
        type: string
      publication_config:
        description: Reviewed configuration path in the caller repository
        required: true
        type: string
      artifact_name:
        description: Same-run artifact containing release.tar (required for releases)
        default: ''
        type: string
      renew_only:
        description: Renew TUF metadata without rebuilding or changing releases
        default: false
        type: boolean
      spec_path:
        default: spec.json
        type: string
      initialize:
        description: Permit an absent TUF timestamp on the first release only
        default: false
        type: boolean
    secrets:
      PUBLISHER_SIGNING_KEY:
        required: false
      TUF_TARGETS_KEY:
        required: true
      TUF_SNAPSHOT_KEY:
        required: true
      TUF_TIMESTAMP_KEY:
        required: true
      S3_ACCESS_KEY_ID:
        required: false
      S3_SECRET_ACCESS_KEY:
        required: false
      S3_SESSION_TOKEN:
        required: false
      ARTIFACTORY_ACCESS_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  prepare:
    if: github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (inputs.renew_only && github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    outputs:
      publication_key: ${{ steps.identity.outputs.key }}
    steps:
      - name: Require immutable tooling
        env:
          TOOLING_REF: ${{ inputs.tooling_ref }}
        run: '[[ "$TOOLING_REF" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          path: caller
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tooling_repository }}
          ref: ${{ inputs.tooling_ref }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./tooling
      - name: Identify the destination for serialization
        id: identity
        env:
          PUBLICATION_CONFIG: ${{ inputs.publication_config }}
        run: |
          key=$(python -m installer_prototype.ci_publication identity --root caller --config "$PUBLICATION_CONFIG")
          echo "key=$key" >> "$GITHUB_OUTPUT"
  publish:
    needs: prepare
    # Never sign pull_request, pull_request_target, or arbitrary workflow_run artifacts.
    if: github.event_name == 'push' || github.event_name == 'release' || github.event_name == 'workflow_dispatch' || (inputs.renew_only && github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    environment: publisher-release
    concurrency:
      # Every workflow writing this destination must use this same group.
      group: installer-publication-${{ needs.prepare.outputs.publication_key }}
      cancel-in-progress: false
      queue: max
    steps:
      - name: Require immutable tooling
        env:
          TOOLING_REF: ${{ inputs.tooling_ref }}
        run: '[[ "$TOOLING_REF" =~ ^[0-9a-fA-F]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          path: caller
          persist-credentials: false
      # Reusable workflows otherwise check out the CALLER repository by default.
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.tooling_repository }}
          ref: ${{ inputs.tooling_ref }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install './tooling[ci]'
      - if: ${{ !inputs.renew_only }}
        run: sudo apt-get update && sudo apt-get install -y 7zip
      - if: ${{ !inputs.renew_only }}
        run: python tools/bootstrap_ifw.py
        working-directory: tooling
      - if: ${{ !inputs.renew_only }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: release-download
      - name: Restore payload modes from the release archive
        if: ${{ !inputs.renew_only }}
        run: python tooling/tools/unpack_release.py release-download/release.tar release-input
      - name: Sign immutable TUF metadata and advance timestamp last
        env:
          PUBLISHER_SIGNING_KEY: ${{ !inputs.renew_only && secrets.PUBLISHER_SIGNING_KEY || '' }}
          TUF_TARGETS_KEY: ${{ secrets.TUF_TARGETS_KEY }}
          TUF_SNAPSHOT_KEY: ${{ secrets.TUF_SNAPSHOT_KEY }}
          TUF_TIMESTAMP_KEY: ${{ secrets.TUF_TIMESTAMP_KEY }}
          RENEW_ONLY: ${{ inputs.renew_only }}
          AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.S3_SESSION_TOKEN }}
          ARTIFACTORY_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
          PUBLICATION_SERIALIZATION_KEY: ${{ needs.prepare.outputs.publication_key }}
          PUBLICATION_CONFIG: ${{ inputs.publication_config }}
          SPEC_PATH: ${{ inputs.spec_path }}
          INITIALIZE: ${{ inputs.initialize }}
        run: |
          command=publisher
          extra=(--artifact release-input --spec "$SPEC_PATH" --ifw tooling/.tools/ifw)
          if [[ "$RENEW_ONLY" == true ]]; then command=publisher-renew; extra=(); fi
          if [[ "$INITIALIZE" == true ]]; then extra+=(--initialize); fi
          python -m installer_prototype.ci_publication "$command" \
            --root caller --config "$PUBLICATION_CONFIG" \
            --output build/publication.json "${extra[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: publication-${{ needs.prepare.outputs.publication_key }}
          path: build/publication.json
          if-no-files-found: error
