name: Real dashboard releases
on:
  workflow_dispatch:
  push:
    paths:
      - 'tooling/installer_tooling/**'
      - 'tools/check_dashboard_releases.py'
      - 'packaging/**'
      - 'tests/test_payloads.py'
      - '.github/workflows/dashboard-releases.yml'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'tooling/installer_tooling/**'
      - 'tools/check_dashboard_releases.py'
      - 'packaging/**'
      - 'tests/test_payloads.py'
      - '.github/workflows/dashboard-releases.yml'
      - 'pyproject.toml'
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - if: runner.os == 'Linux'
        run: bash .github/scripts/install-linux-dependencies.sh
      - if: runner.os == 'macOS'
        run: brew install sevenzip
      - run: python tools/bootstrap_ifw.py
      - name: Package official releases and require native offline install and upgrade
        shell: bash
        run: |
          mkdir -p build
          python -u tools/check_dashboard_releases.py --ifw .tools/ifw 2>&1 | tee build/dashboard-check.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-dashboard-results-${{ matrix.os }}
          retention-days: 14
          path: |
            build/dashboard-check.log
            build/dashboard-report.json
            build/dashboard-releases/provenance.json
            build/dashboard-releases/native/*.log
          if-no-files-found: error
